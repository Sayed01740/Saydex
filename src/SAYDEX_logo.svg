<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="gemCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9FFF7"/><stop offset=".38" stop-color="#18D8D1"/><stop offset="1" stop-color="#0877E8"/>
    </linearGradient>
    <linearGradient id="gemBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B8DFF"/><stop offset=".55" stop-color="#2449E8"/><stop offset="1" stop-color="#6526FF"/>
    </linearGradient>
    <linearGradient id="gemPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3158FF"/><stop offset=".5" stop-color="#6E2DEB"/><stop offset="1" stop-color="#D51DFF"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E4D2"/><stop offset="1" stop-color="#16B9B0"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->

  <!-- Crystal icon -->
  <g transform="translate(105 55)">
    <polygon points="170,0 338,112 310,295 170,430 28,295 0,112" fill="#071B36" stroke="#0DD8E0" stroke-width="2"/>
    <polygon points="170,0 28,112 170,152 170,0" fill="url(#gemCyan)"/>
    <polygon points="170,0 170,152 242,112" fill="#084C98"/>
    <polygon points="170,0 242,112 338,112" fill="#21D7DF"/>
    <polygon points="242,112 338,112 310,205 170,152" fill="#B8F8F4" opacity=".72"/>
    <polygon points="28,112 170,152 92,220 0,255" fill="#16BFCF"/>
    <polygon points="170,152 242,112 310,205 170,255" fill="#243EBA"/>
    <polygon points="92,220 170,152 170,255 28,295" fill="#1266C7"/>
    <polygon points="170,152 170,255 310,205 310,295" fill="#2638B5"/>
    <polygon points="28,295 170,255 170,430" fill="url(#gemBlue)"/>
    <polygon points="170,255 310,295 170,430" fill="url(#gemPurple)"/>
    <polygon points="28,295 92,220 170,255 170,430" fill="#2456D9" opacity=".75"/>
    <polygon points="170,255 310,205 310,295 170,430" fill="#7130D7" opacity=".7"/>
    <g fill="none" stroke="#B9FFFF" stroke-opacity=".42" stroke-width="1.5">
      <path d="M170 0L170 152L170 430"/><path d="M28 112L170 152L338 112"/>
      <path d="M0 255L92 220L170 255L310 205"/><path d="M28 295L170 255L310 295"/>
    </g>
  </g>

  <!-- SAYDEX wordmark: letters separated explicitly so D can never be hidden -->
  <g font-family="Montserrat, Inter, Arial, sans-serif" font-size="112" font-weight="500" fill="#F7F7F7">
    <text x="520" y="325">S</text>
    <text x="650" y="325">A</text>
    <text x="790" y="325">Y</text>
    <text x="930" y="325">D</text>
  </g>

  <!-- Custom E -->
  <g transform="translate(1075 243)" fill="none" stroke="#F7F7F7" stroke-width="16" stroke-linecap="square">
    <path d="M0 0H82"/><path d="M0 40H82"/><path d="M0 80H82"/>
  </g>

  <!-- Custom X -->
  <g transform="translate(1215 243)" stroke="url(#xGrad)" stroke-width="17" stroke-linecap="square">
    <path d="M0 0L78 80"/><path d="M78 0L0 80"/>
  </g>
</svg>
